top:17px;display:flex;align-items:center;gap:9px;color:white;font-size:12px}.account small{color:#81a394;display:block}.main{flex:1;min-width:0}.topbar{height:66px;background:#fff;border-bottom:1px solid var(--line);padding:0 37px;display:flex;align-items:center;justify-content:space-between}.crumb{color:#899892;font-size:12px}.crumb strong{color:var(--ink);font-weight:600}.top-actions{display:flex;align-items:center;gap:17px;color:#71837a;font-size:12px}.icon-btn{border:0;background:transparent;color:inherit;font-size:18px}.content{max-width:1420px;margin:auto;padding:33px 38px 70px}.page-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:25px}.eyebrow{color:#4d927a;font-size:10px;letter-spacing:2.2px;font-weight:700;margin-bottom:7px}.page-head h1{margin:0;font-size:29px;letter-spacing:-1.1px;font-weight:700}.subtitle{color:var(--muted);font-size:12px;margin-top:6px}.head-actions{display:flex;gap:9px}.btn{border:1px solid #d8e4dc;background:white;color:#325b4d;border-radius:7px;padding:9px 13px;font-weight:600;font-size:12px;display:inline-flex;align-items:center;gap:7px}.btn:hover{border-color:#77ad88;background:#f7fcf7}.btn.primary{background:#1c765c;border-color:#1c765c;color:white}.btn.primary:hover{background:#145b47}.btn.soft{background:#e8f2e9;border-color:#e8f2e9}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,1fr)}.card{background:#fff;border:1px solid var(--line);border-radius:11px;box-shadow:0 2px 10px #234b2905}.stat{padding:19px 21px;min-height:130px;position:relative}.stat:after{content:'';position:absolute;right:18px;top:18px;width:31px;height:31px;background:#e6f3e9;border-radius:8px}.stat-icon{position:absolute;right:25px;top:21px;color:#358466;z-index:1;font-size:15px}.stat-label{color:#73867e;font-size:12px}.stat strong{display:block;font-size:29px;line-height:1.2;margin:13px 0 4px;letter-spacing:-1.2px}.stat small{color:#87a098;font-size:11px}.stat small em{color:#208b65;font-style:normal}.low }.guide p{margin:0;color:#678074;font-size:11px}.guide .btn{background:white}.table-card{overflow:hidden}.toolbar{padding:18px 20px;display:flex;justify-content:space-between;gap:12px;align-items:center}.tabs{display:flex;gap:17px}.tab{border:0;background:none;color:#82958b;padding:8px 2px;border-bottom:2px solid transparent;font-size:12px}.tab.active{color:#1d755a;border-color:#1d755a;font-weight:700}.search{height:35px;border:1px solid var(--line);background:#fafcf9;border-radius:7px;padding:0 11px;width:215px;color:#2b5141;outline:none;font-size:12px}.search:focus{border-color:#82b99b}table{border-collapse:collapse;width:100%;font-size:12px}th{text-align:left;background:#f9fbf8;color:#8c9c93;font-weight:500;padding:12px 20px;white-space:nowrap}td{padding:14px 20px;border-top:1px solid #eef2ee;white-space:nowrap}tr:hover td{background:#fbfdfb}.person{display:flex;gap:9px;align-items:center}.person .avatar{width:29px;height:29px;font-size:11px}.tag{padding:3px 8px;border-radius:4px;font-size:10px;color:#317558;background:#e8f5ea;display:inline-block}.tag.gray{background:#eff2ef;color:#7a8b81}.tag.warn{background:#fff2e1;color:#aa793c}.table-foot{padding:13px 20px;border-top:1px solid #eef2ee;color:#91a097;font-size:11px;display:flex;justify-content:space-between}.detail-grid{grid-template-columns:repeat(3,1fr)}.mini{padding:19px}.mini h3{margin:0;font-size:13px}.mini p{font-size:11px;color:#84968b;margin:7px 0 16px}.mini strong{font-size:21px}.mini .track{margin-top:12px}.wide-grid{grid-template-columns:1fr 1fr}.setting{padding:18px 20px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line)}.setting:first-of-type{border:0}.setting b{font-size:12px}.setting p{font-size:11px;color:#91a197;margin:3px 0}.toggle{width:33px;height:19px;border:0;background:#b7c8b9;border-radius:50px;padding:2px;transition:.2s}.toggle:after{content:'';display:block;width:15px;height:15px;background:white;border-radius:50%;transition:.2s}.toggle.on{background:#267d61}.toggle.on:after{transform:translateX(14px)}.modal-overlay{position:fixed;inset:0;background:#0d241dcc;display:none;align-items:center;justify-content:center;z-index:10;padding:20px}.modal-overlay.open{display:flex}.modal{background:white;width:min(480px,100%);border-radius:13px;box-shadow:0 24px 90px #071f1a55;padding:25px}.modal h2{margin:0 0 5px;font-size:19px}.modal p{margin:0 0 22px;color:#819289;font-size:12px}.field{display:block;margin:15px 0;color:#435f50;font-weight:600;font-size:12px}.field input,.field select{display:block;width:100%;margin-top:7px;border:1px solid #d9e5db;border-radius:7px;padding:10px;background:#fff;outline:none}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:24px}.toast{position:fixed;right:28px;bottom:25px;background:#1b5746;color:#fff;padding:12px 17px;border-radius:7px;box-shadow:0 10px 25px #1b574633;display:none;font-size:12px}.toast.show{display:block}.mobile-top{display:none}@media(max-width:1050px){.stats{grid-template-columns:repeat(2,1fr)}.lower,.split{grid-template-columns:1fr}.sidebar{width:195px}.content{padding:28px 24px}}@media(max-width:700px){.sidebar{display:none}.mobile-top{display:block}.topbar{padding:0 16px;height:56px}.content{padding:24px 16px}.stats,.detail-grid,.wide-grid{grid-template-columns:1fr 1fr}.page-head{gap:15px}.page-head h1{font-size:23px}.head-actions{flex-wrap:wrap;justify-content:flex-end}.toolbar{flex-wrap:wrap}.table-card{overflow:auto}table{min-width:670px}}@media(max-width:480px){.stats,.detail-grid,.wide-grid{grid-template-columns:1fr}.page-head{display:block}.head-actions{margin-top:15px}.top-actions{display:none}}

<div class="app">

  </aside>
  <div class="pl-mobile-scrim" onclick="plToggleMobileMenu(false)"></div><main class="main"><header class="topbar"><button class="pl-mobile-menu" aria-label="打开导航菜单" aria-expanded="false" onclick="plToggleMobileMenu()">☰</button><div class="crumb"><span class="mobile-top">Carbon Agent　/　</span>青屿科技　/　管理控制台　/　<strong id="crumb">总览</strong></div><div class="top-actions"><span>企业版有效期至 2027.10.12</span><button class="icon-btn" title="通知" onclick="toast('暂无新通知')">♧</button><div class="avatar" style="width:29px;height:29px;font-size:11px">林</div></div></header><div class="content" id="content"></div></main>
</div>
<div class="modal-overlay" id="overlay" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal"></div></div><div class="toast" id="toast"></div>
<script>
const icons={overview:'<path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z"/>',members:'<circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2M17 5a3 3 0 0 1 0 6m0 3a5 5 0 0 1 4 5"/>',seats:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 9h6M7 13h10"/>',usage:'<path d="M3 19V9m6 10V5m6 14v-7m6 7V3"/>',agents:'<rect x="4" y="5" width="16" height="15" rx="3"/><path d="M9 10h.01M15 10h.01M9 15h6M12 2v3"/>',knowledge:'<path d="M4 5a2 2 0 0 1 2-2h14v17H6a2 2 0 0 0-2 2zM4 5v15a2 2 0 0 1 2-2h14"/>',security:'<path d="M12 2l8 4v6c0 5-3 8-8 10-5-2-8-5-8-10V6zM9 12l2 2 4-4"/>'};
const items=[['overview','总览'],['members','成员与组织'],['seats','席位管理'],['usage','用量与额度'],['agents','智能体与技能'],['knowledge','知识与连接器'],['security','安全与审计']];let page='overview', memberFilter='all', seatFilter='all';let members=[{name:'陈思远',department:'产品研发部',role:'成员',seat:'企业版',activity:'刚刚',quota:'20,000',status:'活跃'}, {name:'李宛清',department:'市场部',role:'部门管理员',seat:'企业版',activity:'今天 09:42',quota:'15,000',status:'活跃'}, {name:'王越',department:'财务部',role:'成员',seat:'企业版',activity:'昨天 17:28',quota:'10,000',status:'活跃'}, {name:'赵可欣',department:'产品研发部',role:'成员',seat:'未分配',activity:'—',quota:'—',status:'待加入'}, {name:'周启明',department:'设计部',role:'成员',seat:'企业版',activity:'10月11日',quota:'20,000',status:'活跃'}];
function svg(key){return `<svg viewBox="0 0 24 24">${icons[key]}</svg>`}function renderNav(){document.getElementById('nav').innerHTML=items.map(([id,label],i)=>`${i===4||i===6?'<div class="nav-label">'+(i===4?'能力配置':'企业治理')+'</div>':''}<button class="nav ${page===id?'active':''}" onclick="go('${id}')">${svg(id)}${label}</button>`).join('')}function go(id){page=id;renderNav();document.getElementById('crumb').textContent=items.find(x=>x[0]===id)[1];document.getElementById('content').innerHTML=views[id]();window.scrollTo({top:0,behavior:'smooth'})}function head(k,title,desc,actions=''){return `<div class="page-head"><div><div class="eyebrow">${k}</div><h1>${title}</h1><div class="subtitle">${desc}</div></div><div class="head-actions">${actions}</div></div>`}function stat(label,value,foot,icon){return `<div class="card stat"><span class="stat-icon">${icon}</span><div class="stat-label">${label}</div><strong>${value}</strong><small>${foot}</small></div>`}function trend(){return `<div class="card"><div class="card-head"><div><h2>使用趋势</h2><p>过去 7 天的组织活跃情况</p></div><button class="link" onclick="go('usage')">查看分析 ↗</button></div><div class="chart-wrap"><div class="chart-top"><strong>1,284</strong><span>↗ 18.6% 较上周</span></div><div class="chart"><svg viewBox="0 0 650 180" preserveAspectRatio="none"><defs><linearGradient id="grad" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#c1e4cc" stop-opacity=".7"/><stop offset="1" stop-color="#c1e4cc" stop-opacity="0"/></linearGradient></defs><path d="M0 135 C55 125 70 145 125 107 S210 125 265 85 S335 115 390 73 S470 95 520 49 S590 68 650 21 L650 180 L0 180Z" fill="url(#grad)"/><path d="M0 135 C55 125 70 145 125 107 S210 125 265 85 S335 115 390 73 S470 95 520 49 S590 68 650 21" fill="none" stroke="#4b9b71" stroke-width="3"/><circle cx="650" cy="21" r="5" fill="#4b9b71" stroke="white" stroke-width="3"/></svg></div><div class="chart-labels"><span>10月07日</span><span>10月08日</span><span>10月09日</span><span>10月10日</span><span>10月11日</span><span>10月12日</span><span>10月13日</span></div></div></div>`}function overview(){return `${head('OVERVIEW / 组织总览','管理好团队的每一次智能协作','实时掌握组织使用、席位与资源状态，快速处理需要关注的事项。','<button class="btn" onclick="toast(\'报表已准备好（原型演示）\')">⇩ 导出报表</button><button class="btn primary" onclick="openModal(\'invite\')">＋ 邀请成员</button>')}<div class="grid stats">${stat('团队成员','48','<em>↑ 6</em> 本月新增','♧')}${stat('席位使用','38 / 50','剩余 <em>12</em> 个可分配','▤')}${stat('本月积分消耗','642.8K','总额度 1,000K · 已用 64.3%','◈')}${stat('活跃智能体','12','覆盖 6 个业务部门','✳')}</div><div class="grid lower">${trend()}<div class="card"><div class="card-head"><div><h2>资源使用分布</h2><p>本月 · 按团队</p></div><button class="link" onclick="go('usage')">查看详情 ↗</button></div><div class="use-list">${[['产品研发部',78,'78%'],['市场部',56,'56%'],['财务部',41,'41%'],['设计部',32,'32%']].map(([n,w,v],i)=>`<div class="use-row"><span>${n}</span><div class="track"><div class="fill ${i===0?'gold':''}" style="width:${w}%"></div></div><b>${v}</b></div>`).join('')}<div style="background:#f5f9f4;border-radius:7px;padding:12px;color:#6a8374;font-size:11px;margin-top:23px">◌ &nbsp;产品研发部即将达到月度额度，建议调整配额。</div></div></div></div><div class="section-title"><h2>最近动态</h2><button class="link" onclick="go('security')">全部审计日志 ↗</button></div><div class="grid split"><div class="card activity">${[['陈思远 使用「数据分析助手」完成任务','2 分钟前'],['林立 为市场部调整成员月额度','1 小时前'],['李宛清 创建「Campaign Brief」智能体','昨天 16:24'],['系统 自动回收离职成员席位','10月11日']].map((a,i)=>`<div class="activity-row"><i class="dot ${i===1?'gold':''}"></i><b>${a[0]}</b><span>${a[1]}</span></div>`).join('')}</div><div class="card guide"><div><h3>让团队更快开始</h3><p>完成成员邀请、席位分配与共享智能体配置。</p></div><button class="btn" onclick="go('members')">查看成员 →</button></div></div>`}
function memberTable(){let q=(document.getElementById('member-search')?.value||'').trim();let rows=members.filter(m=>(memberFilter==='all'||(memberFilter==='active'?m.status==='活跃':m.status!=='活跃'))&&(!q||m.name.includes(q)||m.department.includes(q)));document.getElementById('member-body').innerHTML=rows.map((m,i)=>`<tr><td><div class="person"><div class="avatar">${m.name.slice(0,1)}</div><b>${m.name}</b></div></td><td>${m.department}</td><td>${m.role}</td><td><span class="tag ${m.seat==='未分配'?'gray':''}">${m.seat}</span></td><td>${m.quota}</td><td>${m.activity}</td><td><button class="link" onclick="openModal('member','${m.name}')">管理</button></td></tr>`).join('')||'<tr><td colspan="7" style="text-align:center;color:#9ca99f;padding:30px">没有匹配的成员</td></tr>';document.getElementById('member-count').textContent=`共 ${rows.length} 位成员`}function filterMembers(v){memberFilter=v;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.filter===v));memberTable()}
function membersView(){setTimeout(memberTable);return `${head('PEOPLE / 组织管理','成员与组织','统一管理成员、部门、角色和访问资格。','<button class="btn" onclick="toast(\'批量导入模板已准备好（原型演示）\')">⇧ 批量导入</button><button class="btn primary" onclick="openModal(\'invite\')">＋ 邀请成员</button>')}<div class="grid detail-grid">${stat('组织成员','48','4 个部门','♧')}${stat('本月活跃','34','活跃率 70.8%','◈')}${stat('待加入','3','邀请链接有效期 7 天','◌')}</div><div class="section-title"><h2>成员列表</h2><small>组织架构同步：今天 09:30</small></div><div class="card table-card"><div class="toolbar"><div class="tabs"><button class="tab active" data-filter="all" onclick="filterMembers('all')">全部成员</button><button class="tab" data-filter="active" onclick="filterMembers('active')">已激活</button><button class="tab" data-filter="pending" onclick="filterMembers('pending')">待加入</button></div><input class="search" id="member-search" placeholder="⌕  搜索成员或部门" oninput="memberTable()" /></div><table><thead><tr><th>成员</th><th>所属部门</th><th>组织角色</th><th>席位状态</th><th>月额度</th><th>最近活跃</th><th>操作</th></tr></thead><tbody id="member-body"></tbody></table><div class="table-foot"><span id="member-count"></span><span>原型示例数据 · 1 / 1</span></div></div>`}
function seatRows(){let arr=[['产品研发部','部门 · 登录时分配','16 / 22','2026-09-01'],['市场部','部门 · 自动分配','10 / 10','2026-09-01'],['陈思远','指定成员','1','2026-09-12'],['王越','指定成员','1','2026-09-16']];return arr.map(r=>`<tr><td><b>${r[0]}</b></td><td><span class="tag">${r[1]}</span></td><td>${r[2]}</td><td>${r[3]}</td><td><button class="link" onclick="openModal('release','${r[0]}')">释放 / 编辑</button></td></tr>`).join('')}

function agentsView(){let a=[['财务报表分析','财务部','已发布','1,258','林立'],['市场洞察研究','市场部','已发布','896','李宛清'],['研发知识问答','产品研发部','已发布','742','陈思远'],['Campaign Brief','市场部','草稿','—','李宛清']];return `${head('AGENTS / 能力资产','智能体与技能','沉淀企业共用的 AI 能力，明确发布范围与责任人。','<button class="btn" onclick="toast(\'技能库已打开（原型演示）\')">技能库</button><button class="btn primary" onclick="openModal(\'agent\')">＋ 创建智能体</button>')}<div class="grid detail-grid">${stat('企业智能体','12','其中 9 个已发布','✳')}${stat('共享技能','28','本月新增 4 个','◈')}${stat('本月任务运行','3,642','成功率 98.2%','↗')}</div><div class="section-title"><h2>智能体列表</h2><small>管理员可管理发布范围与负责人</small></div><div class="card table-card"><div class="toolbar"><div class="tabs"><button class="tab active">全部智能体</button><button class="tab" onclick="toast('已筛选已发布智能体（原型演示）')">已发布</button><button class="tab" onclick="toast('已筛选草稿（原型演示）')">草稿</button></div><input class="search" placeholder="⌕  搜索智能体" /></div><table><thead><tr><th>名称</th><th>可见范围</th><th>状态</th><th>本月调用</th><th>负责人</th><th>操作</th></tr></thead><tbody>${a.map(r=>`<tr><td><b>✳ &nbsp;${r[0]}</b></td><td>${r[1]}</td><td><span class="tag ${r[2]==='草稿'?'gray':''}">${r[2]}</span></td><td>${r[3]}</td><td>${r[4]}</td><td><button class="link" onclick="openModal('agent','${r[0]}')">配置</button></td></tr>`).join('')}</tbody></table><div class="table-foot">共 12 个智能体 <span>原型示例数据 · 1 / 1</span></div></div>`}
function knowledgeView(){return `${head('DATA / 组织资产','知识与连接器','管理智能体可访问的企业知识与外部系统。','<button class="btn" onclick="openModal(\'connector\')">连接应用</button><button class="btn primary" onclick="openModal(\'knowledge\')">＋ 新建知识库</button>')}<div class="grid detail-grid">${stat('企业知识库','8','23,642 份文档','▤')}${stat('已连接应用','6','2 个需重新授权','⌁')}${stat('本月检索','18.4K','命中率 91%','↗')}</div><div class="section-title"><h2>知识库</h2></div><div class="grid detail-grid">${[['产品规范与设计','产品研发部','6,280 份文档'],['客户案例库','市场部','3,420 份文档'],['财务制度与流程','财务部','1,160 份文档']].map(([a,b,c])=>`<div class="card mini"><h3>▤ &nbsp;${a}</h3><p>${b} · ${c}</p><button class="link" onclick="openModal('knowledge','${a}')">管理权限 →</button></div>`).join('')}</div><div class="section-title"><h2>连接器</h2><small>授权范围遵循最小权限原则</small></div><div class="grid wide-grid">${[['飞书','已连接 · 组织文档'],['企业微信','已连接 · 联系人'],['GitHub','需要重新授权 · 代码仓库'],['Google Drive','已连接 · 云端文件']].map(([a,b])=>`<div class="card mini"><h3>◫ &nbsp;${a}</h3><p>${b}</p><button class="link" onclick="openModal('connector','${a}')">管理连接 →</button></div>`).join('')}</div>`}
function securityView(){return `${head('GOVERNANCE / 安全治理','安全与审计','设置组织访问策略，追踪关键管理操作。','<button class="btn" onclick="toast(\'审计日志已导出（原型演示）\')">⇩ 导出日志</button>')}<div class="grid wide-grid"><div class="card"><div class="card-head" style="padding-bottom:12px"><div><h2>访问与安全策略</h2><p>变更立即应用于组织成员</p></div></div>${[['单点登录 SSO','通过企业身份提供商统一登录',true],['敏感操作二次确认','删除知识库、释放席位等操作需要确认',true],['外部分享限制','禁止向组织外分享智能体和知识库',false],['用量达到 80% 时通知','通过站内信提醒管理员',true]].map(([a,b,c])=>`<div class="setting"><div><b>${a}</b><p>${b}</p></div><button class="toggle ${c?'on':''}" aria-label="切换${a}" onclick="this.classList.toggle('on');toast('策略已更新（原型演示）')"></button></div>`).join('')}</div><div class="card"><div class="card-head"><div><h2>角色与权限</h2><p>基于职责授权管理范围</p></div><button class="link" onclick="openModal('role')">管理角色 ↗</button></div><div class="use-list">${[['超级管理员','2 人','全部配置与审计权限'],['部门管理员','4 人','部门成员、额度与智能体管理'],['成员','42 人','按授权使用资源']].map(([a,b,c])=>`<div style="padding:14px 0;border-bottom:1px solid #edf2ed"><b style="font-size:12px">${a}</b><span style="float:right;color:#287657;font-size:11px">${b}</span><div style="font-size:11px;color:#96a59b;margin-top:4px">${c}</div></div>`).join('')}</div></div></div><div class="section-title"><h2>最近审计事件</h2><small>保留管理行为与关键资源变更记录</small></div><div class="card table-card"><table><thead><tr><th>时间</th><th>操作人</th><th>事件</th><th>对象</th><th>结果</th></tr></thead><tbody>${[['今天 10:18','林立','调整月额度','市场部','成功'],['今天 09:44','林立','分配席位','赵可欣','成功'],['昨天 16:24','李宛清','创建智能体','Campaign Brief','成功'],['10月11日 15:21','系统','自动回收席位','离职成员','成功']].map(r=>`<tr>${r.slice(0,4).map(x=>`<td>${x}</td>`).join('')}<td><span class="tag">${r[4]}</span></td></tr>`).join('')}</tbody></table></div>`}

function openModal(kind,name=''){const defs={invite:['邀请成员','发送邀请并设置初始组织角色。',`<label class="field">工作邮箱<input id="modal-input" type="email" placeholder="name@company.com"></label><label class="field">所属部门<select><option>产品研发部</option><option>市场部</option><option>财务部</option><option>设计部</option></select></label><label class="field">初始角色<select><option>成员</option><option>部门管理员</option></select></label>`,'发送邀请'],seat:['分配席位','指定成员，或按部门设置自动授权策略。',`<label class="field">分配对象<select><option>指定成员</option><option>指定部门</option></select></label><label class="field">成员或部门<input id="modal-input" placeholder="输入名称"></label><label class="field">分配策略<select><option>立即分配</option><option>首次登录时分配</option></select></label>`,'确认分配'],quota:['调整月额度','额度用于控制成员或部门的月度积分消耗。',`<label class="field">对象<select><option>产品研发部</option><option>市场部</option><option>财务部</option><option>设计部</option><option>指定成员</option></select></label><label class="field">月额度（积分）<input id="modal-input" type="number" placeholder="例如 200000"></label>`,'保存额度'],expand:['调整席位','当前已分配 38 个席位。缩容后总席位数不得低于已分配数。',`<label class="field">席位总数<input id="modal-input" type="number" min="38" value="50"></label>`,'保存变更'],release:['管理分配策略',`正在管理 ${name} 的席位授权。`, `<label class="field">操作<select><option>编辑分配策略</option><option>释放席位</option></select></label><label class="field">释放说明<input placeholder="填写原因（可选）"></label>`,'确认'],member:['管理成员',`正在管理 ${name}。`,`<label class="field">组织角色<select><option>成员</option><option>部门管理员</option><option>超级管理员</option></select></label><label class="field">月额度（积分）<input id="modal-input" type="number" placeholder="20000"></label>`,'保存'],agent:[name?'配置智能体':'创建智能体','设置名称、可见范围与负责人。',`<label class="field">名称<input id="modal-input" value="${name}" placeholder="例如 客户研究助手"></label><label class="field">可见范围<select><option>全组织</option><option>指定部门</option><option>仅创建者</option></select></label>`,'保存'],knowledge:[name?'管理知识库':'新建知识库','知识访问应与团队工作范围一致。',`<label class="field">知识库名称<input id="modal-input" value="${name}" placeholder="知识库名称"></label><label class="field">访问范围<select><option>指定部门</option><option>全组织</option><option>仅管理员</option></select></label>`,'保存'],connector:['连接器管理',`配置 ${name||'企业应用'} 的连接与授权范围。`,`<label class="field">应用<select><option>${name||'飞书'}</option><option>企业微信</option><option>GitHub</option><option>Google Drive</option></select></label><label class="field">授权范围<select><option>仅指定知识库</option><option>全组织</option></select></label>`,'保存'],role:['角色权限','为管理角色设置可访问范围。',`<label class="field">角色<select><option>部门管理员</option><option>成员</option></select></label><label class="field">管理范围<select><option>所属部门</option><option>全组织</option></select></label>`,'保存']};let d=defs[kind];document.getElementById('modal').innerHTML=`<h2>${d[0]}</h2><p>${d[1]}</p>${d[2]}<div class="modal-actions"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="submitModal('${kind}')">${d[3]}</button></div>`;document.getElementById('overlay').classList.add('open')}function closeModal(){document.getElementById('overlay').classList.remove('open')}function submitModal(kind){let v=document.getElementById('modal-input');if(v&&v.hasAttribute('required')&&!v.value.trim())return; if(kind==='invite'&&v?.value){members.push({name:v.value.split('@')[0],department:'产品研发部',role:'成员',seat:'未分配',activity:'—',quota:'—',status:'待加入'});if(page==='members')go('members')}closeModal();toast('操作已保存（原型演示）')}let timer;function toast(msg){let el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>el.classList.remove('show'),2800)}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});go('overview');
</script>
